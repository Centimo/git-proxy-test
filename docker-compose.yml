services:
  forgejo:
    build:
      context: .
      dockerfile: forgejo/Dockerfile
      network: host
    container_name: forgejo
    environment:
      - FORGEJO_ADMIN_USER=${FORGEJO_ADMIN_USER:?FORGEJO_ADMIN_USER must be set}
      - FORGEJO_ADMIN_PASSWORD=${FORGEJO_ADMIN_PASSWORD:?FORGEJO_ADMIN_PASSWORD must be set}
      - FORGEJO_ADMIN_EMAIL=${FORGEJO_ADMIN_EMAIL:-admin@localhost}
      - PROXY_CONFIG=${PROXY_CONFIG:-/config/hooks.yml}
      - PROXY_PORT=${PROXY_PORT:-8080}
      # Comma-separated allowlist of upstream git hosts (host or host=<baseURL>).
      - PROXY_SOURCES=${PROXY_SOURCES:-github.com}
    restart: unless-stopped
    # host networking required: this machine uses redsocks for outbound traffic,
    # and redsocks only intercepts traffic from the host netns (not Docker bridge).
    # Without host mode, Forgejo cannot reach the upstream source hosts through the proxy.
    network_mode: host
    volumes:
      - /workspace/cache/git-proxy:/data
      - /workspace/cache/git-proxy/hooks-config:/config:ro
